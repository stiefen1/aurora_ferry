scenario_generation:
  experiment_name: "max_course_rate_tuning"
  description: "test pairs of dchi, corridor_width"
  seed: 42
  number_of_scenarios: 10
  safety_distance_at_spawn: 300

  simulation:
    duration_sec_at_mean_target_speed: 1200
    dt: 0.2

  guidance: 
    update_every_sec: 30
    lookahead_distance: 2500.0
    colregs: true
    good_seamanship: true
    abort_colregs_after_iter: 2
    max_course_rate: 0.7
    buffer_target_ships: 100.0
    trim_path: 600.0
    term_dist: 200.0
    dchi: 7.5
    du: 0.2
    delay: 5
    delay_type: 'symmetric'
    corridor_width: 70
    simplify_corridor: 10.0
    max_iter: 10
    move_p_0_allowed_after_iter: 0
    move_p_f_allowed_after_iter: 8
    smooth_radius: 200.0
    kp: 0.01
    max_shrink_dist_per_step: 50.0
    shrink_eps: 0.1
    v_min: 1.0
    new_traj_offset: 50.0

  navigation:
    q_tt: 0.4
    r_ais: [10, 10, 0.04, 0.00122]
    r_camera: [0.00008, 640000]
    ground_truth_target_ships: false
    ground_truth_update_every_sec: 1
    distance_threshold_target_tracking: 2500.0
    use_ais_every: 1
    forget_target_after_sec: 1500

  control:
    path_to_weights: 'models/sac/2026_06_29_10_48_42'
    algorithm: 'sac'

  ais_data_paths: "data/raw"
  exclude_from_ais:
    - "2023_04_11_13_00.csv"
    - "2023_04_05_18_30.csv"
    - "2023_04_08_14_30.csv"
    - "2023_04_17_08_30.csv"
    - "2023_04_16_16_30.csv"
    - "2023_04_08_15_30.csv"
    - "2023_04_17_05_30.csv"

  mmsi_to_exclude: [265041000]

  start:
    Helsingor: [[6212200, 6212700], [351800, 352000]] # 6212309, 351458
    Helsingborg: [[6212600, 6213300], [355700, 356000]] # 6213303, 356200
    info: "Each start position is associated with ranges for possible east-north values"

  operational_domain:
    ferry:
      target_speed:
        min: 5
        max: 7.5
        mean: 6.5
        std: 1
      mass: 2250000
      passengers:
        number:
          min: 10
          max: 1250
        mass:
          min: 63
          max: 93
          std: 5
          mean: 78
      cars:
        number:
          min: 0
          max: 240
        mass:
          min: 900
          max: 1500
          std: 100
          mean: 1200

    wind:
      angle:
        min: -3.14159
        max: 3.14159
        ornstein_uhlenbeck:
          attraction: 0.03
          amplitude: 0.05
      speed:
        min: 0.0
        max: 15.0
        ornstein_uhlenbeck:
          attraction: 0.03
          amplitude: 0.1
      info: "According to https://app.fcoo.dk/ifm-maps/denmark/, wind up to 15m/s in any direction"

    current:
      angle:
        min: -3.14159
        max: 3.14159
        ornstein_uhlenbeck:
          attraction: 0.03
          amplitude: 0.01
      speed:
        min: 0.0
        max: 1.0
        ornstein_uhlenbeck:
          attraction: 0.01
          amplitude: 0.1
      info: "According to https://app.fcoo.dk/ifm-maps/denmark/, current up to 2kn in both directions"

    illumination:
      min: 0.0
      max: 1.0

    visibility:
      min: 0.0
      max: 1.0

  sensors:
    states:
      noise_covariance:
        min:
          - 1e-3
          - 1e-3
          - 0.00035
          - 5e-3
          - 5e-3
          - 5e-3
          - 0.00314159
          - 0.00314159
          - 0.00314159
          - 0.00314159
        max:
          - 1e-2
          - 1e-2
          - 0.0035
          - 5e-2
          - 5e-2
          - 5e-2
          - 0.0314159
          - 0.0314159
          - 0.0314159
          - 0.0314159
    ais:
      enabled: True
      update_every_sec: 1
      noise_covariance:
        min:
          - 3.0
          - 3.0
          - 0.1
          - 0.005
        max:
          - 5.0
          - 5.0
          - 0.5
          - 0.015
        info: "measure states are N, E, SOG [kn], COG [rad]"
    camera:
      enabled: True
      update_every_sec: 1
      failure:
        prob: 0.0
        time: 
          min: 0
          max: 1
          mean: 0.3
          std: 0.1
      info: "probability of a camera blackout during an episode."

